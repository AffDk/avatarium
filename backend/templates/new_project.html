{% extends "base.html" %}

{% block title %}New Project — Avatarium{% endblock %}

{% block content %}
<div class="new-project">
    <h1>Create New Project</h1>

    <form id="project-form" class="form-stack">
        <!-- Title -->
        <div class="form-group">
            <label for="title">Project Title</label>
            <input type="text" id="title" name="title" required
                   maxlength="200" placeholder="My Avatar Video" class="form-input">
        </div>

        <!-- Style Selection -->
        <div class="form-group">
            <label>Video Style</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="video_style" value="animation" checked>
                    <span>🎨 Animation</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="video_style" value="movie_like">
                    <span>🎬 Movie-like</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Create Project</button>
    </form>

    <!-- Photo Upload (shown after project creation) -->
    <div id="upload-section" class="upload-section" style="display: none;">
        <h2>Upload Photos</h2>
        <p class="help-text">
            Filename format: <code>&lt;personName&gt;_&lt;number&gt;.jpg</code>
            (e.g., <code>alice_1.jpg</code>, <code>alice_2.png</code>, <code>bob_1.webp</code>)
        </p>

        <div id="dropzone" class="dropzone">
            <div class="dropzone-content">
                <span class="dropzone-icon">📸</span>
                <p>Drag & drop photos here or <label for="file-input" class="link">browse</label></p>
                <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/webp" hidden>
            </div>
        </div>

        <!-- Filename validation feedback -->
        <div id="file-preview" class="file-preview"></div>

        <!-- Person grouping preview -->
        <div id="person-groups" class="person-groups"></div>

        <button id="upload-btn" class="btn btn-primary" disabled>Upload Photos</button>

        <!-- Scenario -->
        <div class="form-group" style="margin-top: 2rem;">
            <label for="scenario">Scenario <span class="char-count" id="char-count">0 / 10000</span></label>
            <textarea id="scenario" name="scenario" class="form-input"
                      maxlength="10000" rows="6"
                      placeholder="Describe the scene you want to generate..."></textarea>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
{% endblock %}
