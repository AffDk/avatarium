{% extends "base.html" %}

{% block title %}Dashboard — Avatarium{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>My Projects</h1>
        <a href="/new-project" class="btn btn-primary">+ New Project</a>
    </div>

    <div id="project-list" class="project-grid">
        <!-- Populated by JavaScript -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">🎬</div>
        <h2>No projects yet</h2>
        <p>Create your first avatar video project to get started.</p>
        <a href="/new-project" class="btn btn-primary">Create Project</a>
    </div>
</div>

<script>
(function() {
    // Helper: read a cookie value by name
    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
    }

    const token = getCookie('access_token');
    // Server-side already redirects unauthenticated users to /login,
    // so if we still have no token at this point, just show the empty state.
    if (!token) {
        document.getElementById('project-list').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
        return;
    }

    // ── Delete project ───────────────────────────
    async function deleteProject(projectId, cardEl) {
        if (!confirm('Delete this project? This cannot be undone.')) return;
        try {
            const resp = await fetch(`/api/projects/${projectId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (resp.ok) {
                cardEl.remove();
                // Check if grid is now empty
                const list = document.getElementById('project-list');
                if (!list.querySelector('.project-card')) {
                    list.style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                }
            } else {
                alert('Failed to delete project.');
            }
        } catch {
            alert('Network error — could not delete project.');
        }
    }
    window._deleteProject = deleteProject;

    fetch('/api/projects', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.json())
    .then(data => {
        const list = document.getElementById('project-list');
        const empty = document.getElementById('empty-state');

        if (!data.items || data.items.length === 0) {
            list.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        data.items.forEach(project => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <h3>${project.title}</h3>
                <div class="project-meta">
                    <span class="badge badge-${project.status}">${project.status}</span>
                    <span class="style-tag">${project.video_style === 'animation' ? '🎨 Animation' : '🎬 Movie-like'}</span>
                </div>
                <p class="project-date">Created: ${new Date(project.created_at).toLocaleDateString()}</p>
                <div class="project-card-actions">
                    <a href="/projects/${project.id}" class="btn btn-secondary">Open</a>
                    <button type="button" class="btn btn--danger btn--sm" onclick="window._deleteProject('${project.id}', this.closest('.project-card'))">🗑️ Delete</button>
                </div>
            `;
            list.appendChild(card);
        });
    })
    .catch(() => {
        // Show empty state on network error instead of redirect loop
        document.getElementById('project-list').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
    });
})();
</script>
{% endblock %}
